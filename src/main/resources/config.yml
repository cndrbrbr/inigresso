# Inigresso – Konfiguration, siehe rules.md und architecture.md
worlds: [world]

portal:
  min-distance: 48
  protect-radius: 4
  resonator-radius: 3
  resonator-blocks: [COPPER_BLOCK, IRON_BLOCK, GOLD_BLOCK, REDSTONE_BLOCK,
                     LAPIS_BLOCK, EMERALD_BLOCK, AMETHYST_BLOCK, DIAMOND_BLOCK]

proposal:
  min-level: 2
  max-open: 3

link:
  # Reichweite eines Portals = range-base × Portalstufe², höchstens max-range (Blöcke).
  # 160: L1 160, L2 640, L3 1440, ab L4 2000.
  range-base: 160
  max-range: 2000
  max-outgoing: 8
  # Höhe des Partikelstrahls über dem Kernblock (Blöcke)
  beam-height: 5.0

decay:
  percent-per-day: 15
  time: "03:00"

hack:
  cooldown-minutes: 5
  max-per-4h: 4
  key-chance: 0.50
  # XP-Belohnung je Hack: xp-per-level × Portalstufe (neutrale Portale zählen als 1),
  # am gegnerischen Portal × xp-enemy-factor. XP braucht man zum Aufladen (1 XP = 10 Energie).
  xp-per-level: 10
  xp-enemy-factor: 1.5

player:
  max-items: 500

cycle:
  start-day: MONDAY
  # Zykluslänge in Stunden (168 = eine Woche) und Abstand der Messpunkte in Minuten.
  # Zum Testen z. B. length-hours: 1 und measure-minutes: 5.
  length-hours: 168
  measure-minutes: 60

# Automatische Portale an der Oberfläche (rules.md §2.4): eins je Rasterzelle spacing × spacing,
# um bis zu jitter Blöcke versetzt. Nur auf natürlichem Boden, Bauten werden übersprungen.
auto-portals:
  enabled: false
  spacing: 100
  jitter: 25

# Scoreboard rechts am Bildschirm für alle Spieler: Fläche, Einfluss, Portale und
# Eroberungen beider Fraktionen, Restzeit des Zyklus, Top-Eroberer.
scoreboard:
  enabled: true

# Webkarte (BlueMap): bis zu welcher Kameraentfernung (Blöcke) Portal-Symbole sichtbar sind.
# Neutrale Portale nur nah – bei hunderten Symbolen ruckelt die Karte sonst im Browser.
webmap:
  neutral-max-distance: 1500
  owned-max-distance: 6000
